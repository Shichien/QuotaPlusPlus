[package]
name = "qpp"
version = "0.3.5"
edition = "2024"
license = "MIT"
description = "QuotaPlusPlus for Codex"

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
age = "0.11.1"
base64 = "0.22.1"
chrono = "0.4.42"
directories = "6.0.0"
fs2 = "0.4.3"
keyring = { version = "3.6", default-features = false, features = ["crypto-rust"] }
rand = "0.9.2"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37.0", features = ["backup", "bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
tauri = { version = "2.8.2", features = [] }
tiny_http = "0.12.0"
toml_edit = "0.23.7"
url = "2.5.7"
webbrowser = "1.0.6"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["linux-native-async-persistent"] }

[dev-dependencies]
tempfile = "3.23.0"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = "symbols"
