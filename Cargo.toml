[package]
name = "qpp"
version = "0.2.1"
edition = "2024"
license = "MIT"
description = "QuotaPlusPlus for Codex"

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
chrono = "0.4.42"
directories = "6.0.0"
fs2 = "0.4.3"
rusqlite = { version = "0.37.0", features = ["backup", "bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.8.2", features = [] }
toml_edit = "0.23.7"
url = "2.5.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3.23.0"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = "symbols"
