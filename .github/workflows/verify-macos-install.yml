name: Verify macOS installation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-macos-install.yml"
      - "Casks/qpp.rb"

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - macos-14
          - macos-15-intel

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Install from the Homebrew tap
        run: |
          brew tap shichien/qpp "https://github.com/${{ github.repository }}"
          brew install --cask shichien/qpp/qpp

      - name: Verify the installed application
        run: |
          test -d /Applications/QuotaPlusPlus.app
          test -x /Applications/QuotaPlusPlus.app/Contents/MacOS/qpp
          if xattr -p com.apple.quarantine /Applications/QuotaPlusPlus.app >/dev/null 2>&1; then
            echo "QuotaPlusPlus.app still has the quarantine attribute" >&2
            exit 1
          fi
