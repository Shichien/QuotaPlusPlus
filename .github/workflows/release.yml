name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            rust_target: ""
            args: --bundles nsis,msi
          - name: Windows ARM64
            os: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc --bundles msi
          - name: macOS universal
            os: macos-14
            rust_target: universal-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
          - name: Linux x64
            os: ubuntu-22.04
            rust_target: ""
            args: --bundles appimage,deb
          - name: Linux ARM64
            os: ubuntu-22.04-arm
            rust_target: ""
            args: --bundles appimage,deb

    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target
        if: matrix.rust_target != '' && matrix.rust_target != 'universal-apple-darwin'
        run: rustup target add ${{ matrix.rust_target }}

      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Import Apple certificate
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ env.APPLE_CERTIFICATE }}
          p12-password: ${{ env.APPLE_CERTIFICATE_PASSWORD }}

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: CSwitch v__VERSION__
          releaseBody: CSwitch v__VERSION__
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
