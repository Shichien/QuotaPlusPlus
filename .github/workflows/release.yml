name: Build and release QuotaPlusPlus

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact: qpp-windows-x64
            target: ""
            tauri_args: ""
          - platform: macos-15-intel
            artifact: qpp-macos-x64
            target: x86_64-apple-darwin
            tauri_args: --target x86_64-apple-darwin --bundles dmg
          - platform: macos-14
            artifact: qpp-macos-arm64
            target: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin --bundles dmg
          - platform: ubuntu-22.04
            artifact: qpp-linux-x64
            target: ""
            tauri_args: --bundles appimage,deb

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Run tests
        run: cargo test --locked

      - name: Validate Homebrew Cask
        if: matrix.artifact == 'qpp-macos-arm64'
        run: brew style Casks/qpp.rb

      - name: Build Windows executable
        if: runner.os == 'Windows'
        run: cargo build --release --locked

      - name: Build macOS and Linux bundles
        if: runner.os != 'Windows'
        uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.tauri_args }}
          retryAttempts: 2

      - name: Verify macOS bundle layout
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg="$(find "target/${{ matrix.target }}/release/bundle/dmg" -name '*.dmg' -print -quit)"
          test -n "$dmg"
          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
            rmdir "$mount_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          hdiutil attach "$dmg" -mountpoint "$mount_dir" -nobrowse -readonly
          test -d "$mount_dir/QuotaPlusPlus.app"
          test -x "$mount_dir/QuotaPlusPlus.app/Contents/MacOS/qpp"

      - name: Prepare Windows release assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'release-assets' -Force | Out-Null
          Copy-Item -LiteralPath 'target/release/qpp.exe' -Destination 'release-assets/qpp-windows-x64.exe'
          $repository = '${{ github.repository }}'
          $install = (Get-Content -LiteralPath 'scripts/install.ps1' -Raw).Replace('__QPP_REPOSITORY__', $repository)
          Set-Content -LiteralPath 'release-assets/install.ps1' -Value $install -Encoding utf8NoBOM -NoNewline
          Copy-Item -LiteralPath 'scripts/uninstall.ps1' -Destination 'release-assets/uninstall.ps1'

      - name: Prepare Intel macOS release asset
        if: matrix.artifact == 'qpp-macos-x64'
        run: |
          mkdir -p release-assets
          cp target/x86_64-apple-darwin/release/bundle/dmg/*.dmg release-assets/qpp-macos-x64.dmg

      - name: Prepare Apple silicon macOS release asset
        if: matrix.artifact == 'qpp-macos-arm64'
        run: |
          mkdir -p release-assets
          cp target/aarch64-apple-darwin/release/bundle/dmg/*.dmg release-assets/qpp-macos-arm64.dmg

      - name: Prepare Linux release assets
        if: runner.os == 'Linux'
        run: |
          mkdir -p release-assets
          cp target/release/bundle/appimage/*.AppImage release-assets/qpp-linux-x64.AppImage
          cp target/release/bundle/deb/*.deb release-assets/qpp-linux-x64.deb

      - name: Upload platform assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download platform assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
